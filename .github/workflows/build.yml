# Build the macOS, Linux and Windows packages, install each on its own
# platform and check it. A pushed v* tag then publishes them as that
# release, with docs/releases/<tag>.md as its notes (GitHub's generated
# notes if there is none); a release that already exists gets the
# packages attached instead.
name: Build packages

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  # build_app.sh bundles the Python uv finds: a relocatable, uv-managed one.
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  linux-and-windows:
    name: Build Linux and Windows packages
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Qt's libraries
        run: sudo apt-get update -q && sudo apt-get install -yq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Set up .venv
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[test]"
      - name: Tests
        run: QT_QPA_PLATFORM=offscreen .venv/bin/python -m pytest -q
      - name: Build
        run: |
          packaging/linux/build_linux.sh
          packaging/windows/build_windows.sh
      - name: Install and check the Linux package
        run: |
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME" "$RUNNER_TEMP/pkg"
          tar -xzf dist/RhinoERP-*-linux-x86_64.tar.gz -C "$RUNNER_TEMP/pkg"
          "$RUNNER_TEMP"/pkg/RhinoERP-*/install.sh
          APP="$HOME/.local/share/RhinoERP/app"
          "$HOME/.local/bin/rhino-erp" --version
          "$APP/python/bin/python3" -I packaging/smoke_test.py \
            "$HOME/.local/share/RhinoERP/runtime/$(cat "$APP/build-id")" \
            "$(.venv/bin/python -c 'import rhino_erp; print(rhino_erp.__version__)')"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error

  windows-check:
    name: Install and check the Windows package
    needs: linux-and-windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - name: Install, check and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive (Get-Item dist\*.zip).FullName -DestinationPath $env:RUNNER_TEMP\pkg
          $pkg = (Get-ChildItem $env:RUNNER_TEMP\pkg -Directory)[0].FullName
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$pkg\install.ps1"
          if ($LASTEXITCODE -ne 0) { throw 'install.ps1 failed' }
          $app = "$env:LOCALAPPDATA\RhinoERP\app"
          if (-not (Test-Path "$([Environment]::GetFolderPath('Programs'))\Rhino ERP.lnk")) { throw 'no Start menu shortcut' }
          $build = (Get-Content "$app\build-id" -Raw).Trim()
          $version = $build.Split('-')[0]
          & "$app\python\python.exe" -I "$app\launcher.py" --version
          if ($LASTEXITCODE -ne 0) { throw 'launcher failed' }
          & "$app\python\python.exe" -I packaging\smoke_test.py "$env:LOCALAPPDATA\RhinoERP\runtime\$build" $version
          if ($LASTEXITCODE -ne 0) { throw 'smoke test failed' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$pkg\uninstall.ps1"
          if (Test-Path "$env:LOCALAPPDATA\RhinoERP") { throw 'uninstall left files' }

  macos:
    name: Build and check the macOS app
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Set up .venv
        run: |
          uv python install 3.12
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[test]"
      - name: Tests
        run: QT_QPA_PLATFORM=offscreen .venv/bin/python -m pytest -q
      - name: Build
        run: packaging/macos/build_app.sh
      - name: Check the app
        run: |
          APP="dist/Rhino ERP.app"
          RES="$APP/Contents/Resources"
          "$APP/Contents/MacOS/RhinoERP" --version
          BUILD="$(cat "$RES/build-id")"
          LIB="$HOME/Library/Application Support/RhinoERP/runtime/$BUILD"
          "$RES/python/bin/python3" -I -B "$RES/bootstrap.py" "$RES" "$LIB"
          "$RES/python/bin/python3" -I -B packaging/smoke_test.py "$LIB" \
            "$(.venv/bin/python -c 'import rhino_erp; print(rhino_erp.__version__)')"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  release:
    name: Attach to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-and-windows, windows-check, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          NOTES="docs/releases/$TAG.md"
          cd dist
          sha256sum RhinoERP-* > SHA256SUMS
          cat SHA256SUMS
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber RhinoERP-* SHA256SUMS
          elif [ -f "../$NOTES" ]; then
            gh release create "$TAG" --verify-tag --title "Rhino ERP ${TAG#v}" \
              --notes-file "../$NOTES" RhinoERP-* SHA256SUMS
          else
            gh release create "$TAG" --verify-tag --title "Rhino ERP ${TAG#v}" \
              --generate-notes RhinoERP-* SHA256SUMS
          fi
